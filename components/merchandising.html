<section class="merch-section" id="merchandising">
  <div class="container-standard">
    
    <!-- HEADER -->
    <div class="section-header">
      <span class="section-subtitle" data-i18n="merchandising.subtitle">Equipamiento Oficial</span>
      <h2 class="section-title">
        <span data-i18n="merchandising.title_1">COSTA FIT </span>
        <span class="highlight-red" data-i18n="merchandising.title_highlight">WEAR</span>
      </h2>
      <p class="section-description" data-i18n="merchandising.description">Lleva los colores del club dentro y fuera del centro. Consigue tu equipamiento directamente en recepción.</p>
    </div>

    <!-- GRID DE PRODUCTOS SIMPLIFICADO -->
    <div class="merch-grid">

      <!-- PRODUCTO 1: CAMISETA -->
      <article class="merch-card">
        <div class="merch-img-wrapper">
          <img src="img/store/camiseta-costafitcalella.png" alt="Camiseta Oficial Costa Fit" data-i18n-alt="merchandising.products.tshirt.alt" class="merch-img">
        </div>
        <div class="merch-content">
          <h3 class="product-title" data-i18n="merchandising.products.tshirt.title">Camiseta Técnica</h3>
          <div class="size-info">
            <span class="size-label" data-i18n="merchandising.sizes_label">Tallas:</span>
            <div class="size-options">
              <span class="size-tag">S</span>
              <span class="size-tag">M</span>
              <span class="size-tag">L</span>
              <span class="size-tag">XL</span>
            </div>
          </div>
        </div>
      </article>

      <!-- PRODUCTO 2: SHORTS -->
      <article class="merch-card">
        <div class="merch-img-wrapper">
          <img src="img/store/thai-short-costafitcalella.png" alt="Pantalón Muay Thai Costa Fit" data-i18n-alt="merchandising.products.shorts.alt" class="merch-img">
        </div>
        <div class="merch-content">
          <h3 class="product-title" data-i18n="merchandising.products.shorts.title">Thai short Costa Fit</h3>
          <div class="size-info">
            <span class="size-label" data-i18n="merchandising.sizes_label">Tallas:</span>
            <div class="size-options">
              <span class="size-tag">S</span>
              <span class="size-tag">M</span>
              <span class="size-tag">L</span>
              <span class="size-tag">XL</span>
            </div>
          </div>
        </div>
      </article>

      <!-- PRODUCTO 3: GORRA -->
      <article class="merch-card">
        <div class="merch-img-wrapper">
          <img src="img/store/gorra-costafitcalella.png" alt="Gorra Snapback Costa Fit" data-i18n-alt="merchandising.products.cap.alt" class="merch-img">
        </div>
        <div class="merch-content">
          <h3 class="product-title" data-i18n="merchandising.products.cap.title">Gorra Costa Fit</h3>
          <div class="size-info">
            <span class="size-label" data-i18n="merchandising.size_label_single">Talla:</span>
            <div class="size-options">
              <span class="size-tag" data-i18n="merchandising.size_onesize">Única</span>
            </div>
          </div>
        </div>
      </article>

      <!-- PRODUCTO 4: SUDADERA -->
      <article class="merch-card">
        <div class="merch-img-wrapper">
          <img src="img/store/sudadera-costafitcalella.png" alt="Sudadera Hoodie Costa Fit" data-i18n-alt="merchandising.products.hoodie.alt" class="merch-img">
        </div>
        <div class="merch-content">
          <h3 class="product-title" data-i18n="merchandising.products.hoodie.title">Sudadera Costa Fit</h3>
          <div class="size-info">
            <span class="size-label" data-i18n="merchandising.sizes_label">Tallas:</span>
            <div class="size-options">
              <span class="size-tag">S</span>
              <span class="size-tag">M</span>
              <span class="size-tag">L</span>
              <span class="size-tag">XL</span>
            </div>
          </div>
        </div>
      </article>

    </div>
  </div>
</section>
