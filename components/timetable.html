<section id="timetable" class="section section-timetable">

    <div class="container">

        <!-- ================= CABECERA  ================= -->
        <div class="section-header">

            <span
                class="section-label"
                data-lang="schedule_label">
                ORGANIZACIÓN
            </span>

            <h2
                class="section-title"
                data-lang="schedule_title">
                Horario
            </h2>

        </div>


        <!-- ==================================================
             HOY / SEMANA
        ================================================== -->

        <div class="schedule-controls">

            <div class="schedule-view-buttons">

                <button
                    type="button"
                    class="schedule-view-btn active"
                    data-view="today"
                    data-lang="schedule_today">
                    Hoy
                </button>

                <button
                    type="button"
                    class="schedule-view-btn"
                    data-view="week"
                    data-lang="schedule_week">
                    Semana
                </button>

            </div>

        </div>


        <!-- ==================================================
             VISTA HOY
        ================================================== -->

        <div
            id="schedule-today"
            class="schedule-today">

            <!-- CABECERA DEL DÍA -->

            <div class="schedule-day-header">

                <button
                    type="button"
                    class="schedule-arrow"
                    id="schedule-prev-day"
                    aria-label="Día anterior">
                    ‹
                </button>


                <div class="schedule-current-day">

                    <span id="schedule-day-name">
                        Lunes
                    </span>

                    <small id="schedule-day-date"></small>

                </div>


                <button
                    type="button"
                    class="schedule-arrow"
                    id="schedule-next-day"
                    aria-label="Día siguiente">
                    ›
                </button>

            </div>


            <!-- SELECTOR DE DÍAS -->

            <div class="schedule-days">

                <button
                    type="button"
                    data-day="lunes">

                    <span data-lang="schedule_monday_letter">
                        L
                    </span>

                    <small data-lang="schedule_monday_short">
                        Lun
                    </small>

                </button>


                <button
                    type="button"
                    data-day="martes">

                    <span data-lang="schedule_tuesday_letter">
                        M
                    </span>

                    <small data-lang="schedule_tuesday_short">
                        Mar
                    </small>

                </button>


                <button
                    type="button"
                    data-day="miércoles">

                    <span data-lang="schedule_wednesday_letter">
                        X
                    </span>

                    <small data-lang="schedule_wednesday_short">
                        Mié
                    </small>

                </button>


                <button
                    type="button"
                    data-day="jueves">

                    <span data-lang="schedule_thursday_letter">
                        J
                    </span>

                    <small data-lang="schedule_thursday_short">
                        Jue
                    </small>

                </button>


                <button
                    type="button"
                    data-day="viernes">

                    <span data-lang="schedule_friday_letter">
                        V
                    </span>

                    <small data-lang="schedule_friday_short">
                        Vie
                    </small>

                </button>

            </div>


            <!-- ==================================================
                 CLASES GENERADAS POR JS
            ================================================== -->

            <div
                id="schedule-day-classes"
                class="schedule-day-classes">
            </div>

        </div>


         <!-- =========================
             SEMANA
        ========================== -->

        <div
            id="schedule-week"
            class="schedule-week"
            hidden>

            <div class="schedule-table-wrapper">

                <div class="schedule-table-scroll">

                    <table class="schedule-table-grid">

                        <thead>

                            <tr>

                                <th
                                    class="hour"
                                    data-lang="schedule_hour">
                                    Hora
                                </th>

                                <th data-day-header="lunes"></th>
                                <th data-day-header="martes"></th>
                                <th data-day-header="miercoles"></th>
                                <th data-day-header="jueves"></th>
                                <th data-day-header="viernes"></th>

                            </tr>

                        </thead>

                        <tbody id="schedule-week-body"></tbody>

                    </table>

                </div>

            </div>

        </div>
       

</section>


<!-- =========================================================
     MODAL RESERVA
========================================================= -->

<div
    id="bookingOverlay"
    class="booking-overlay"
    aria-hidden="true">

    <div
        class="booking-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="booking-title">

        <div class="booking-modal-header">

            <div>

                <span
                    class="booking-eyebrow"
                    data-lang="booking_label">
                    COSTA FIT · RESERVA
                </span>

                <h2
                    id="booking-title"
                    data-lang="booking_title">
                    Reserva tu clase
                </h2>

            </div>


            <button
                type="button"
                class="booking-close"
                id="bookingClose"
                aria-label="Cerrar">
                ×
            </button>

        </div>


        <!-- CLASE SELECCIONADA -->

        <div class="booking-selected">

            <div class="booking-selected-top">

                <strong id="bookingClass">
                    Muay Thai
                </strong>

                <span class="booking-price">
                    10 €
                </span>

            </div>

            <span id="bookingDate">
                Lunes · 26 de agosto
            </span>

            <span id="bookingTime">
                10:30 - 11:30
            </span>

        </div>


        <!-- FORMULARIO -->

        <form id="bookingForm">

            <div class="booking-field">

                <label
                    for="bookingName"
                    data-lang="booking_name">
                    Nombre
                </label>

                <input
                    type="text"
                    id="bookingName"
                    name="name"
                    required
                    autocomplete="name"
                    placeholder="Tu nombre">

            </div>


            <div class="booking-field">

                <label
                    for="bookingPhone"
                    data-lang="booking_phone">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="bookingPhone"
                    name="phone"
                    required
                    autocomplete="tel"
                    placeholder="600 000 000">

            </div>


            <div class="booking-field">

                <label
                    for="bookingEmail"
                    data-lang="booking_email">
                    Email
                </label>

                <input
                    type="email"
                    id="bookingEmail"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="tu@email.com">

            </div>


            <div class="booking-total">

                <span data-lang="booking_total">
                    Total
                </span>

                <strong>
                    10 €
                </strong>

            </div>


            <button
                type="submit"
                class="booking-confirm">

                <span data-lang="booking_whatsapp">
                    Reservar por WhatsApp
                </span>

                <span class="booking-whatsapp-icon">
                    ↗
                </span>

            </button>

        </form>


        <p
            class="booking-note"
            data-lang="booking_note">
            Al confirmar se abrirá WhatsApp con los datos de tu reserva.
        </p>

    </div>

</div>
